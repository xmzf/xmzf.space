<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XMZF Studio — Designing in motion.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080a"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f1efe8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200 M0 560 H1200"/>
    <path d="M80 0 V630 M240 0 V630 M400 0 V630 M560 0 V630 M720 0 V630 M880 0 V630 M1040 0 V630"/>
  </g>

  <!-- top brand row -->
  <g font-family="JetBrains Mono, monospace" fill="#8a9099" font-size="18" letter-spacing="3">
    <text x="80" y="90">XMZF / STUDIO</text>
    <text x="1120" y="90" text-anchor="end">EST · 2024</text>
  </g>
  <line x1="80" y1="110" x2="1120" y2="110" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- center paper card with XMZF wordmark -->
  <rect x="240" y="170" width="720" height="290" rx="6" fill="url(#paper)"/>

  <!-- top hairline + tag -->
  <line x1="540" y1="208" x2="660" y2="208" stroke="#0a0a0a" stroke-width="1"/>
  <text x="600" y="232" font-family="JetBrains Mono, monospace" font-size="14" fill="#0a0a0a" text-anchor="middle">— EST · 2024 —</text>

  <!-- XMZF wordmark: X regular, M italic, Z regular, F italic (artistic rhythm) -->
  <g font-family="Playfair Display, Georgia, serif" font-weight="900" font-size="160" fill="#0a0a0a" text-anchor="middle">
    <text x="372" y="370">X</text>
    <text x="478" y="370" font-style="italic">M</text>
    <text x="600" y="370">Z</text>
    <text x="716" y="370" font-style="italic">F</text>
  </g>

  <!-- underline -->
  <line x1="380" y1="408" x2="820" y2="408" stroke="#0a0a0a" stroke-width="2"/>

  <!-- subtitle -->
  <text x="600" y="438" font-family="JetBrains Mono, monospace" font-size="20" fill="#0a0a0a" text-anchor="middle" letter-spacing="6">S  T  U  D  I  O</text>

  <!-- bottom row -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <g font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="2">
    <text x="80" y="580" fill="#e8ecf1" font-weight="500">Designing in motion.</text>
    <text x="1120" y="580" text-anchor="end" fill="#8a9099">SHANGHAI / REMOTE</text>
  </g>
</svg>
